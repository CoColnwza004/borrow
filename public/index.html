<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบยืม-คืนอุปกรณ์ โรงพยาบาล</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- หน้าเข้าสู่ระบบ -->
  <section id="login-view" class="login-wrap" hidden>
    <form id="login-form" class="card login-card">
      <div class="brand-mark">+</div>
      <h1>ระบบยืม-คืนอุปกรณ์</h1>
      <p class="muted">สำหรับหน่วยงานภายในโรงพยาบาล</p>
      <label>ชื่อผู้ใช้<input name="username" autocomplete="username" required></label>
      <label>รหัสผ่าน<input name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="error" hidden></p>
      <button class="btn primary block" type="submit">เข้าสู่ระบบ</button>
    </form>
  </section>

  <!-- แอปหลัก -->
  <div id="app-view" class="layout" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark sm">+</span> ยืม-คืนอุปกรณ์</div>
      <nav id="nav"></nav>
      <div class="user-box">
        <div id="user-name" class="user-name"></div>
        <div id="user-dept" class="muted small"></div>
        <div class="user-actions">
          <button class="link" id="btn-password">เปลี่ยนรหัสผ่าน</button>
          <button class="link" id="btn-logout">ออกจากระบบ</button>
        </div>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <button class="btn icon menu-toggle" id="menu-toggle" aria-label="เมนู">☰</button>
        <h2 id="page-title"></h2>
      </header>
      <div id="page" class="page"></div>
    </main>
  </div>

  <dialog id="modal">
    <form method="dialog" class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="btn icon" value="close" aria-label="ปิด">✕</button>
    </form>
    <div id="modal-body" class="modal-body"></div>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <div id="print-area"></div>

  <script src="app.js"></script>
</body>
</html>
