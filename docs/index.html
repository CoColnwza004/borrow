<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>ระบบเบิก-ยืมพัสดุ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Noto Sans Thai = ฟอนต์หน้าเว็บสำหรับเครื่องที่ไม่ใช่ Apple, Sarabun = ฟอนต์ในเอกสาร PDF -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav" id="nav-bar">
    <div class="nav-inner">
      <a href="#/" class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5Zm0 2.3L18.7 8 12 11.7 5.3 8 12 4.3ZM5 9.7l6 3.3v6.6l-6-3.3V9.7Zm8 9.9V13l6-3.3v6.6l-6 3.3Z"/></svg>
        </span>
        <span id="brand-name">เบิก-ยืมพัสดุ</span>
      </a>
      <nav id="nav-links" class="nav-links"></nav>
      <button class="nav-admin" id="btn-admin" type="button"></button>
      <button class="nav-toggle" id="menu-toggle" type="button" aria-label="เมนู" aria-expanded="false"><span></span><span></span></button>
    </div>
  </header>

  <main id="page" class="page"></main>

  <dialog id="modal" class="sheet">
    <form method="dialog" class="sheet-head">
      <h3 id="modal-title"></h3>
      <button class="icon-btn" value="close" aria-label="ปิด">
        <svg viewBox="0 0 24 24"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6 6.4 5Z"/></svg>
      </button>
    </form>
    <div id="modal-body" class="sheet-body"></div>
  </dialog>

  <div id="loading" class="loading" hidden><span class="spinner"></span>กำลังบันทึก...</div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="seed-data.js"></script>
  <script src="core.js"></script>
  <script src="pdf.js"></script>
  <script src="app.js"></script>
</body>
</html>
