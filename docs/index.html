  <link rel="preload" href="fonts/NotoSansThai-thai.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/NotoSansThai-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">

  <link rel="preload" href="tour/1-home.jpg" as="image" fetchpriority="low">
</head>
<body>
  <header class="nav" id="nav-bar">

      <a href="#/" class="brand">
        <span class="brand-mark" aria-hidden="true">

  <script src="config.js" defer></script>
  <script src="core.js" defer></script>
  <script src="pdf.js" defer></script>
  <script src="app.js" defer></script>
